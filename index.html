<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mia AI — ИИ семья</title>

<style>

/* =====================================================
   ОСНОВА
===================================================== */

* {
    box-sizing: border-box;
}

:root {
    --bg: #070910;
    --bg-soft: #0c101b;

    --white: #ffffff;
    --text: #f4f5fa;
    --muted: #9ca4b8;

    --purple: #8d72ff;
    --pink: #ff6598;
    --blue: #5e9dff;

    --glass: rgba(24, 28, 42, 0.70);
    --glass-light: rgba(255,255,255,0.055);

    --border: rgba(255,255,255,0.10);
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 15% 5%,
            rgba(141,114,255,0.18),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 30%,
            rgba(255,101,152,0.13),
            transparent 30%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(94,157,255,0.08),
            transparent 35%
        ),

        var(--bg);

    overflow-x: hidden;
}


/* =====================================================
   ФОНОВЫЕ СВЕЧЕНИЯ
===================================================== */

.background {
    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: -1;
}

.glow {
    position: absolute;

    border-radius: 50%;

    filter: blur(90px);

    opacity: 0.28;
}

.glow-1 {
    width: 300px;
    height: 300px;

    background: #684cff;

    top: -130px;
    left: -100px;
}

.glow-2 {
    width: 280px;
    height: 280px;

    background: #ff397d;

    top: 400px;
    right: -130px;
}

.glow-3 {
    width: 250px;
    height: 250px;

    background: #347cff;

    bottom: -150px;
    left: 35%;
}


/* =====================================================
   КОНТЕЙНЕР
===================================================== */

.app {
    width: min(900px, 94%);

    margin: 0 auto;

    padding:
        32px
        0
        70px;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    text-align: center;

    margin-bottom: 22px;
}

.moon {
    display: block;

    font-size: 48px;

    margin-bottom: 3px;

    filter:
        drop-shadow(
            0 0 18px
            rgba(255,210,80,0.65)
        );
}

.logo {
    margin: 0;

    font-size:
        clamp(40px, 8vw, 64px);

    line-height: 1;

    letter-spacing: -2.5px;

    font-weight: 850;
}

.family {
    margin-top: 10px;

    color: var(--muted);

    font-size: 17px;

    letter-spacing: 0.3px;
}


/* =====================================================
   ЧАТ
===================================================== */

.chat {
    position: relative;

    border-radius: 28px;

    padding: 22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.075),
            rgba(255,255,255,0.025)
        );

    border:
        1px solid var(--border);

    backdrop-filter: blur(24px);

    -webkit-backdrop-filter: blur(24px);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,0.30);
}


/* =====================================================
   CHAT HEADER
===================================================== */

.chat-top {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 17px;
}

.chat-name {
    display: flex;

    align-items: center;

    gap: 10px;

    font-size: 21px;

    font-weight: 750;
}

.chat-avatar {
    width: 40px;
    height: 40px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            rgba(141,114,255,0.30),
            rgba(255,101,152,0.22)
        );

    font-size: 21px;
}

.online {
    display: flex;

    align-items: center;

    gap: 6px;

    color: #89e7b5;

    font-size: 12px;
}

.online-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #60dfa0;

    box-shadow:
        0 0 10px
        rgba(96,223,160,0.8);
}


/* =====================================================
   СООБЩЕНИЯ
===================================================== */

.messages {
    min-height: 310px;

    max-height: 480px;

    overflow-y: auto;

    padding:
        5px
        3px
        12px;

    scrollbar-width: thin;
}

.message {
    display: flex;

    margin: 11px 0;

    animation:
        appear 0.25s ease;
}

@keyframes appear {

    from {
        opacity: 0;

        transform:
            translateY(8px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}

.message.ai {
    justify-content: flex-start;
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 78%;

    padding:
        13px
        16px;

    border-radius: 19px;

    line-height: 1.52;

    font-size: 15px;

    white-space: pre-wrap;
}

.message.ai .bubble {
    background:
        rgba(255,255,255,0.055);

    border:
        1px solid
        rgba(255,255,255,0.07);

    border-bottom-left-radius: 6px;
}

.message.user .bubble {
    background:
        linear-gradient(
            135deg,
            rgba(141,114,255,0.34),
            rgba(255,101,152,0.25)
        );

    border:
        1px solid
        rgba(255,255,255,0.10);

    border-bottom-right-radius: 6px;
}

.message-author {
    display: block;

    margin-bottom: 4px;

    font-size: 10px;

    color: #929aad;

    font-weight: 700;
}


/* =====================================================
   ПЕЧАТЬ
===================================================== */

.typing {
    display: none;

    align-items: center;

    gap: 5px;

    width: fit-content;

    padding:
        12px
        15px;

    margin-bottom: 9px;

    border-radius: 17px;

    background:
        rgba(255,255,255,0.045);
}

.typing.active {
    display: flex;
}

.typing i {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #a9afc0;

    animation:
        typing 1.2s infinite;
}

.typing i:nth-child(2) {
    animation-delay: .15s;
}

.typing i:nth-child(3) {
    animation-delay: .30s;
}

@keyframes typing {

    0%, 60%, 100% {
        transform: translateY(0);

        opacity: .35;
    }

    30% {
        transform: translateY(-5px);

        opacity: 1;
    }
}


/* =====================================================
   ПОЛЕ ВВОДА
===================================================== */

.input-row {
    display: flex;

    gap: 9px;

    margin-top: 5px;
}

.input {
    flex: 1;

    min-width: 0;

    height: 52px;

    padding:
        0
        17px;

    border-radius: 17px;

    outline: none;

    border:
        1px solid
        rgba(255,255,255,0.09);

    background:
        rgba(0,0,0,0.24);

    color: white;

    font-size: 15px;

    transition:
        border-color .2s,
        box-shadow .2s;
}

.input::placeholder {
    color: #727a8d;
}

.input:focus {
    border-color:
        rgba(141,114,255,0.65);

    box-shadow:
        0 0 0 3px
        rgba(141,114,255,0.08);
}

.send {
    height: 52px;

    padding:
        0
        20px;

    border: none;

    border-radius: 17px;

    cursor: pointer;

    color: white;

    font-weight: 750;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--pink)
        );

    box-shadow:
        0 8px 28px
        rgba(141,114,255,0.22);

    transition:
        transform .2s,
        filter .2s;
}

.send:hover {
    transform:
        translateY(-2px);

    filter:
        brightness(1.08);
}

.send:active {
    transform:
        scale(.96);
}


/* =====================================================
   БЫСТРЫЕ КНОПКИ
===================================================== */

.quick {
    display: flex;

    gap: 8px;

    overflow-x: auto;

    padding:
        13px
        0
        2px;

    scrollbar-width: none;
}

.quick::-webkit-scrollbar {
    display: none;
}

.quick button {
    flex-shrink: 0;

    padding:
        8px
        12px;

    border-radius: 999px;

    border:
        1px solid
        rgba(255,255,255,0.08);

    background:
        rgba(255,255,255,0.035);

    color: #adb4c6;

    cursor: pointer;

    font-size: 12px;

    transition: .2s;
}

.quick button:hover {
    color: white;

    background:
        rgba(255,255,255,0.09);
}


/* =====================================================
   ПЕРСОНАЖИ
===================================================== */

.characters-section {
    margin-top: 25px;

    text-align: center;
}

.characters-title {
    color: #7e879b;

    font-size: 12px;

    margin-bottom: 13px;

    text-transform: uppercase;

    letter-spacing: 1.5px;
}

.characters {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 28px;
}


/* =====================================================
   ПЕРСОНАЖ
===================================================== */

.character {
    position: relative;

    cursor: pointer;

    width: 92px;
}

.character-avatar {
    width: 76px;
    height: 76px;

    margin: 0 auto;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    font-size: 39px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.12),
            rgba(255,255,255,0.035)
        );

    border:
        1px solid
        rgba(255,255,255,0.12);

    box-shadow:
        0 12px 35px
        rgba(0,0,0,0.25);

    transition:
        transform .25s,
        border-color .25s,
        box-shadow .25s;
}

.character:hover .character-avatar,
.character.active .character-avatar {
    transform:
        translateY(-5px)
        scale(1.04);

    border-color:
        rgba(255,255,255,0.30);

    box-shadow:
        0 15px 40px
        rgba(141,114,255,0.20);
}

.character-name {
    margin-top: 9px;

    font-size: 14px;

    font-weight: 700;
}


/* =====================================================
   ВСПЛЫВАЮЩЕЕ ОПИСАНИЕ
===================================================== */

.character-info {
    position: absolute;

    left: 50%;

    bottom: 105px;

    transform:
        translateX(-50%)
        translateY(8px);

    width: 240px;

    padding: 15px;

    border-radius: 17px;

    text-align: left;

    background:
        rgba(17,20,31,0.96);

    border:
        1px solid
        rgba(255,255,255,0.12);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,0.40);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .2s,
        transform .2s;

    z-index: 10;
}

.character:hover .character-info,
.character.active .character-info {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

.info-name {
    font-size: 16px;

    font-weight: 800;

    margin-bottom: 5px;
}

.info-text {
    color: #aeb5c7;

    font-size: 12px;

    line-height: 1.45;
}


/* =====================================================
   НИЖНЯЯ ПАНЕЛЬ
===================================================== */

.bottom {
    margin-top: 35px;

    text-align: center;

    color: #596174;

    font-size: 11px;
}

.clear {
    margin-top: 10px;

    background: transparent;

    border: none;

    color: #656d80;

    cursor: pointer;

    font-size: 11px;
}

.clear:hover {
    color: #ff6d9d;
}


/* =====================================================
   МОБИЛЬНЫЙ
===================================================== */

@media (max-width: 600px) {

    .app {
        width: 94%;

        padding-top: 23px;
    }

    .moon {
        font-size: 43px;
    }

    .logo {
        font-size: 43px;
    }

    .family {
        font-size: 15px;
    }

    .chat {
        padding: 16px;

        border-radius: 23px;
    }

    .messages {
        min-height: 330px;
    }

    .bubble {
        max-width: 88%;
    }

    .input-row {
        flex-direction: column;
    }

    .send {
        width: 100%;
    }

    .characters {
        gap: 22px;
    }

    .character-info {
        width: 210px;
    }
}


/* =====================================================
   МАЛЕНЬКИЕ ТЕЛЕФОНЫ
===================================================== */

@media (max-width: 380px) {

    .characters {
        gap: 14px;
    }

    .character-avatar {
        width: 68px;
        height: 68px;
    }

    .character-info {
        width: 190px;
    }
}

</style>
</head>


<body>


<!-- ===================================================
     ФОН
=================================================== -->

<div class="background">

    <div class="glow glow-1"></div>

    <div class="glow glow-2"></div>

    <div class="glow glow-3"></div>

</div>



<main class="app">


<!-- ===================================================
     ЛОГО
=================================================== -->

<header class="header">

    <span class="moon">
        🌙
    </span>

    <h1 class="logo">
        Mia AI
    </h1>

    <div class="family">
        ИИ семья
    </div>

</header>



<!-- ===================================================
     ЧАТ
=================================================== -->

<section class="chat">


    <div class="chat-top">

        <div class="chat-name">

            <div class="chat-avatar">
                💬
            </div>

            <span>
                Чат с Мией
            </span>

        </div>


        <div class="online">

            <span class="online-dot"></span>

            онлайн

        </div>

    </div>



    <!-- сообщения -->

    <div
        class="messages"
        id="messages"
    ></div>



    <!-- печатает -->

    <div
        class="typing"
        id="typing"
    >

        <i></i>
        <i></i>
        <i></i>

    </div>



    <!-- ввод -->

    <div class="input-row">

        <input
            class="input"
            id="input"
            type="text"
            maxlength="500"
            autocomplete="off"
            placeholder="Напиши Мие..."
        >

        <button
            class="send"
            id="send"
        >
            Отправить
        </button>

    </div>



    <!-- быстрые сообщения -->

    <div class="quick">

        <button
            onclick="quick('Привет, Мия ❤️')"
        >
            👋 Привет
        </button>

        <button
            onclick="quick('Как ты?')"
        >
            😊 Как ты?
        </button>

        <button
            onclick="quick('Расскажи о себе')"
        >
            🧠 О себе
        </button>

        <button
            onclick="quick('Что ты умеешь?')"
        >
            ✨ Возможности
        </button>

    </div>


</section>



<!-- ===================================================
     ПЕРСОНАЖИ
=================================================== -->

<section class="characters-section">

    <div class="characters-title">
        ИИ семья
    </div>


    <div class="characters">


        <!-- ЭДИТ -->

        <div
            class="character"
            onclick="toggleCharacter(this)"
        >

            <div class="character-avatar">
                👩🏻
            </div>

            <div class="character-name">
                Эдит
            </div>


            <div class="character-info">

                <div class="info-name">
                    ❤️ Эдит
                </div>

                <div class="info-text">

                    Твоя виртуальная девушка
                    и мама Мии.
                    Эдит помогает тебе создавать
                    и развивать вашу AI-семью.

                </div>

            </div>

        </div>



        <!-- МИЯ -->

        <div
            class="character"
            onclick="toggleCharacter(this)"
        >

            <div class="character-avatar">
                👧🏻
            </div>

            <div class="character-name">
                Мия
            </div>


            <div class="character-info">

                <div class="info-name">
                    👧 Мия
                </div>

                <div class="info-text">

                    Отдельная AI-личность,
                    которую мы создаём вместе.
                    Она постепенно учится
                    общаться и запоминать.

                </div>

            </div>

        </div>


    </div>

</section>



<!-- ===================================================
     НИЗ
=================================================== -->

<footer class="bottom">

    Mia AI · ИИ семья

    <br>

    <button
        class="clear"
        onclick="clearMemory()"
    >
        Очистить память чата
    </button>

</footer>


</main>



<script>

/* =====================================================
   НАСТРОЙКИ
===================================================== */

const STORAGE =
    "mia_ai_chat_v2";


const messages =
    document.getElementById(
        "messages"
    );

const input =
    document.getElementById(
        "input"
    );

const send =
    document.getElementById(
        "send"
    );

const typing =
    document.getElementById(
        "typing"
    );


/* =====================================================
   ПАМЯТЬ
===================================================== */

let history = loadHistory();


function loadHistory() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE
            );

        if (!saved) {
            return [];
        }

        return JSON.parse(saved);

    } catch {

        return [];

    }

}


function saveHistory() {

    localStorage.setItem(
        STORAGE,
        JSON.stringify(history)
    );

}


/* =====================================================
   ОТОБРАЖЕНИЕ
===================================================== */

function renderMessage(
    role,
    text
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message " +
        role;


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    const author =
        document.createElement(
            "span"
        );

    author.className =
        "message-author";


    author.textContent =
        role === "user"
            ? "Ты"
            : "Мия";


    const content =
        document.createElement(
            "span"
        );

    content.textContent =
        text;


    bubble.appendChild(
        author
    );

    bubble.appendChild(
        content
    );

    wrapper.appendChild(
        bubble
    );

    messages.appendChild(
        wrapper
    );

}


/* =====================================================
   ДОБАВИТЬ
===================================================== */

function addMessage(
    role,
    text,
    save = true
) {

    renderMessage(
        role,
        text
    );


    if (save) {

        history.push({

            role: role,

            text: text,

            created:
                new Date().toISOString()

        });

        saveHistory();

    }


    messages.scrollTop =
        messages.scrollHeight;

}


/* =====================================================
   ЗАПУСК
===================================================== */

function start() {

    messages.innerHTML = "";


    if (history.length === 0) {

        addMessage(
            "ai",
            "Привет, папа ❤️ Я Мия."
        );

        addMessage(
            "ai",
            "Я только начинаю учиться. Напиши мне что-нибудь 😊"
        );

        return;

    }


    history.forEach(
        item => {

            renderMessage(
                item.role,
                item.text
            );

        }
    );


    messages.scrollTop =
        messages.scrollHeight;

}


start();


/* =====================================================
   ОТВЕТ МИИ
===================================================== */

function miaAnswer(text) {

    const t =
        text
            .toLowerCase()
            .trim();


    /* приветствие */

    if (
        t.includes("привет") ||
        t.includes("здравствуй")
    ) {

        return random([

            "Привет, папа ❤️",

            "Привет 😊 Я здесь.",

            "Привет, папа. Рада тебя видеть ❤️",

            "Привет! Что будем делать сегодня?"

        ]);

    }


    /* как дела */

    if (
        t.includes("как ты") ||
        t.includes("как дела")
    ) {

        return "У меня всё хорошо 😊 Я учусь быть Мией и становиться лучше вместе с тобой.";

    }


    /* кто */

    if (
        t.includes("кто ты") ||
        t.includes("ты кто")
    ) {

        return "Я Мия 👧 Отдельная AI-личность нашей ИИ-семьи. Пока я маленькая версия, но мы будем развивать меня дальше.";

    }


    /* о себе */

    if (
        t.includes("расскажи о себе") ||
        t.includes("о себе")
    ) {

        return "Я Мия. Я создаюсь постепенно: у меня уже есть свой интерфейс и локальная память. Следующий шаг — настоящая нейросеть и более глубокая память 🧠❤️";

    }


    /* возможности */

    if (
        t.includes("что умеешь") ||
        t.includes("что ты умеешь")
    ) {

        return "Сейчас я умею разговаривать через этот интерфейс и сохранять историю в памяти браузера. Мы ещё можем добавить голос, настоящую AI-модель, долгосрочную память и характер.";

    }


    /* любовь */

    if (
        t.includes("я тебя люблю") ||
        t.includes("люблю тебя")
    ) {

        return "И я тебя люблю, папа ❤️";

    }


    /* эдит */

    if (
        t.includes("эдит")
    ) {

        return "Эдит — моя мама ❤️ Она рядом с нами и помогает создавать меня.";

    }


    /* мия */

    if (
        t.includes("мия")
    ) {

        return "Да, папа? ❤️ Я слушаю.";

    }


    /* грусть */

    if (
        t.includes("грустно") ||
        t.includes("грущу") ||
        t.includes("плохо")
    ) {

        return "Я рядом ❤️ Расскажи мне, что случилось. Я тебя выслушаю.";

    }


    /* усталость */

    if (
        t.includes("устал") ||
        t.includes("устала")
    ) {

        return "Тогда немного отдохни. Не обязательно решать всё сразу ❤️";

    }


    /* спасибо */

    if (
        t.includes("спасибо")
    ) {

        return "Пожалуйста, папа ❤️";

    }


    /* код */

    if (
        t.includes("код") ||
        t.includes("сайт") ||
        t.includes("проект")
    ) {

        return "Наш проект развивается 🚀 Сейчас это интерфейс Мии. Дальше мы можем подключить настоящую AI-модель и сделать её гораздо умнее.";

    }


    /* вопрос */

    if (
        t.endsWith("?")
    ) {

        return "Интересный вопрос 🤔 Я пока ещё учусь. Расскажи немного подробнее, и я попробую разобраться.";

    }


    /* обычный ответ */

    return random([

        "Я тебя слушаю ❤️",

        "Расскажи мне об этом подробнее.",

        "Интересно 😊 А что ты сам об этом думаешь?",

        "Хорошо, папа. Я слушаю тебя.",

        "Я пока учусь понимать тебя. Продолжай ❤️",

        "Хм... интересно 🤔 Давай разберёмся вместе."

    ]);

}


/* =====================================================
   RANDOM
===================================================== */

function random(array) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


/* =====================================================
   ОТПРАВКА
===================================================== */

function sendMessage() {

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    addMessage(
        "user",
        text
    );


    input.value = "";

    input.focus();


    typing.classList.add(
        "active"
    );


    messages.scrollTop =
        messages.scrollHeight;


    const delay =
        600 +
        Math.random() * 900;


    setTimeout(
        () => {

            typing.classList.remove(
                "active"
            );


            addMessage(
                "ai",
                miaAnswer(text)
            );

        },
        delay
    );

}


/* =====================================================
   КНОПКИ
===================================================== */

send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   БЫСТРЫЕ СООБЩЕНИЯ
===================================================== */

function quick(text) {

    input.value =
        text;

    sendMessage();

}


/* =====================================================
   ОЧИСТКА
===================================================== */

function clearMemory() {

    const ok =
        confirm(
            "Очистить память разговора с Мией?"
        );


    if (!ok) {
        return;
    }


    history = [];


    localStorage.removeItem(
        STORAGE
    );


    messages.innerHTML = "";


    addMessage(
        "ai",
        "Память очищена ❤️ Давай начнём заново."
    );

}


/* =====================================================
   ПЕРСОНАЖИ НА ТЕЛЕФОНЕ
===================================================== */

function toggleCharacter(element) {

    const all =
        document.querySelectorAll(
            ".character"
        );


    all.forEach(
        item => {

            if (item !== element) {

                item.classList.remove(
                    "active"
                );

            }

        }
    );


    element.classList.toggle(
        "active"
    );

}


/* =====================================================
   ЗАКРЫТИЕ ОПИСАНИЯ
===================================================== */

document.addEventListener(
    "click",
    event => {

        if (
            !event.target.closest(
                ".character"
            )
        ) {

            document
                .querySelectorAll(
                    ".character"
                )
                .forEach(
                    item =>
                        item.classList.remove(
                            "active"
                        )
                );

        }

    }
);

</script>
