<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mia AI — Two Minds</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #060810;
    --text: #f5f6fb;
    --muted: #9ca4b8;

    --purple: #8d72ff;
    --pink: #ff6298;
    --blue: #5e9dff;
    --green: #62e0a1;

    --border: rgba(255,255,255,.10);
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(141,114,255,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 95% 25%,
            rgba(255,98,152,.13),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #060810,
            #090c15
        );

    overflow-x: hidden;
}

button,
input {
    font-family: inherit;
}

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
}

.glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .28;
}

.glow.one {
    width: 320px;
    height: 320px;
    background: #6548ff;
    left: -130px;
    top: -120px;
}

.glow.two {
    width: 300px;
    height: 300px;
    background: #ff3f7f;
    right: -150px;
    top: 350px;
}

.glow.three {
    width: 250px;
    height: 250px;
    background: #357dff;
    left: 40%;
    bottom: -160px;
}

.app {
    width: min(920px, 94%);
    margin: auto;
    padding: 30px 0 70px;
}


/* HEADER */

.header {
    text-align: center;
    margin-bottom: 24px;
}

.moon {
    display: block;
    font-size: 50px;
    margin-bottom: 3px;

    filter:
        drop-shadow(
            0 0 18px
            rgba(255,210,80,.65)
        );
}

.logo {
    margin: 0;

    font-size:
        clamp(42px, 8vw, 64px);

    font-weight: 850;
    letter-spacing: -3px;
}

.family {
    margin-top: 10px;
    color: var(--muted);
    font-size: 17px;
}


/* CHAT */

.chat {
    padding: 21px;
    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        var(--border);

    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.30);
}

.chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 17px;
}

.chat-title {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 21px;
    font-weight: 750;
}

.chat-icon {
    width: 40px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            rgba(141,114,255,.3),
            rgba(255,98,152,.22)
        );

    font-size: 21px;
}

.online {
    display: flex;
    align-items: center;
    gap: 6px;

    color: #8de7b7;
    font-size: 12px;
}

.online-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
        0 0 10px
        rgba(98,224,161,.8);
}


/* ADDRESS MODE */

.address-mode {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 12px;

    padding:
        8px 11px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.025);

    border:
        1px solid
        rgba(255,255,255,.06);

    color: #858da1;

    font-size: 11px;
}

.address-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background:
        var(--purple);

    box-shadow:
        0 0 8px
        rgba(141,114,255,.7);
}


/* MESSAGES */

.messages {
    min-height: 320px;
    max-height: 480px;

    overflow-y: auto;

    padding:
        5px 3px 12px;

    scrollbar-width: thin;
}

.message {
    display: flex;

    margin: 11px 0;

    animation:
        messageIn .25s ease;
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.message.user {
    justify-content: flex-end;
}

.message.mia,
.message.edith {
    justify-content: flex-start;
}

.bubble {
    max-width: 82%;

    padding:
        13px 16px;

    border-radius: 19px;

    line-height: 1.5;

    font-size: 15px;

    white-space: pre-wrap;
}

.message.user .bubble {

    background:
        linear-gradient(
            135deg,
            rgba(141,114,255,.34),
            rgba(255,98,152,.25)
        );

    border:
        1px solid
        rgba(255,255,255,.10);

    border-bottom-right-radius: 6px;
}

.message.mia .bubble {

    background:
        rgba(141,114,255,.075);

    border:
        1px solid
        rgba(141,114,255,.15);

    border-bottom-left-radius: 6px;
}

.message.edith .bubble {

    background:
        rgba(255,98,152,.065);

    border:
        1px solid
        rgba(255,98,152,.15);

    border-bottom-left-radius: 6px;
}

.author {
    display: block;

    margin-bottom: 4px;

    font-size: 10px;

    color: #9199ad;

    font-weight: 700;
}


/* TYPING */

.typing {
    display: none;

    width: fit-content;

    align-items: center;

    gap: 5px;

    padding: 11px 15px;

    margin-bottom: 8px;

    border-radius: 17px;

    background:
        rgba(255,255,255,.045);
}

.typing.active {
    display: flex;
}

.typing span {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #aab0c0;

    animation:
        typing 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {

    0%,60%,100% {
        transform: translateY(0);
        opacity: .3;
    }

    30% {
        transform: translateY(-5px);
        opacity: 1;
    }

}


/* INPUT */

.input-row {
    display: flex;
    gap: 9px;
}

.input {

    flex: 1;

    min-width: 0;

    height: 52px;

    padding:
        0 17px;

    outline: none;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius: 17px;

    background:
        rgba(0,0,0,.24);

    color: white;

    font-size: 15px;
}

.input::placeholder {
    color: #737b8d;
}

.input:focus {

    border-color:
        rgba(141,114,255,.65);

    box-shadow:
        0 0 0 3px
        rgba(141,114,255,.08);
}

.send {

    height: 52px;

    padding:
        0 20px;

    border: 0;

    border-radius: 17px;

    cursor: pointer;

    color: white;

    font-weight: 750;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--pink)
        );

    transition: .2s;
}

.send:hover {

    transform:
        translateY(-2px);
}


/* QUICK */

.quick {

    display: flex;

    gap: 8px;

    overflow-x: auto;

    padding:
        13px 0 2px;

    scrollbar-width: none;
}

.quick::-webkit-scrollbar {
    display: none;
}

.quick button {

    flex-shrink: 0;

    padding:
        8px 12px;

    border-radius: 999px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.035);

    color: #adb4c6;

    cursor: pointer;
}


/* ACTIONS */

.chat-actions {

    display: flex;

    gap: 8px;

    justify-content: flex-end;

    margin-top: 8px;
}

.action {

    padding:
        8px 12px;

    border-radius: 10px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.04);

    color: #929aad;

    cursor: pointer;

    font-size: 11px;
}

.action:hover {

    background:
        rgba(255,255,255,.08);

    color: white;
}


/* CHARACTERS */

.characters {

    margin-top: 24px;

    display: flex;

    justify-content: center;

    gap: 28px;
}

.character {

    width: 110px;

    text-align: center;
}

.character-avatar {

    width: 74px;
    height: 74px;

    margin: auto;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.035)
        );

    border:
        1px solid
        rgba(255,255,255,.12);

    font-size: 37px;

    transition: .25s;
}

.character:hover .character-avatar {

    transform:
        translateY(-5px)
        scale(1.05);

    border-color:
        rgba(255,255,255,.3);
}

.character-name {

    margin-top: 8px;

    font-size: 14px;

    font-weight: 750;
}

.character-age {

    margin-top: 3px;

    color: #777f92;

    font-size: 10px;
}


/* MEMORY */

.memory-grid {

    margin-top: 18px;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;
}

.memory-card {

    padding: 14px;

    border-radius: 17px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.08);
}

.memory-card-title {

    font-size: 12px;

    font-weight: 750;
}

.memory-card-info {

    margin-top: 5px;

    color: #747d91;

    font-size: 10px;

    line-height: 1.5;
}

.memory-online {
    color: var(--green);
}


/* FOOTER */

.footer {

    margin-top: 30px;

    text-align: center;

    color: #596174;

    font-size: 11px;
}


/* MOBILE */

@media (max-width: 650px) {

    .app {

        width: 94%;

        padding-top: 22px;
    }

    .logo {
        font-size: 44px;
    }

    .chat {

        padding: 16px;

        border-radius: 23px;
    }

    .input-row {

        flex-direction: column;
    }

    .send {

        width: 100%;
    }

    .bubble {

        max-width: 90%;
    }

    .memory-grid {

        grid-template-columns: 1fr;
    }

    .chat-actions {

        justify-content: center;

        flex-wrap: wrap;
    }

    .action {

        flex: 1;
    }
}

</style>

</head>


<body>

<script>

/*
==========================================================
 MIA AI
 ДВА ЛОКАЛЬНЫХ МОЗГА

 Никакого GPT.
 Никакого Ollama.
 Никакого API.

 НОВОЕ:

 Если пользователь обращается по имени:

     "Мия, привет"
             ↓
           МИЯ

     "Эдит, привет"
             ↓
           ЭДИТ

 Если имени нет:

     "Привет"
             ↓
        МИЯ + ЭДИТ

==========================================================
*/


/* ======================================================
   STORAGE
====================================================== */

const STORAGE = {

    chat:
        "mia_ai_chat_v7",

    miaMemory:
        "mia_local_memory_v3",

    edithMemory:
        "edith_local_memory_v3",

    dialogue:
        "mia_edith_dialogue_v3"

};


/* ======================================================
   JSON
====================================================== */

function loadJSON(
    key,
    fallback
) {

    try {

        const raw =
            localStorage.getItem(key);

        if (!raw) {
            return fallback;
        }

        return JSON.parse(raw);

    } catch {

        return fallback;

    }

}


function saveJSON(
    key,
    value
) {

    localStorage.setItem(
        key,
        JSON.stringify(value)
    );

}


/* ======================================================
   UTILS
====================================================== */

function normalize(
    text
) {

    return String(text || "")
        .toLowerCase()
        .replace(/[.,!?;:()[\]"«»]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

}


function random(
    array
) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


function sleep(
    ms
) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


function containsAny(
    text,
    words
) {

    return words.some(
        word =>
            text.includes(word)
    );

}


/* ======================================================
   MEMORY
====================================================== */

class LocalMemory {

    constructor(
        owner,
        storageKey
    ) {

        this.owner =
            owner;

        this.storageKey =
            storageKey;

        this.data =
            loadJSON(
                storageKey,
                {
                    facts: [],
                    experiences: [],
                    topics: [],
                    relations: []
                }
            );

        this.ensureStructure();

    }


    ensureStructure() {

        if (!Array.isArray(
            this.data.facts
        )) {

            this.data.facts = [];

        }

        if (!Array.isArray(
            this.data.experiences
        )) {

            this.data.experiences = [];

        }

        if (!Array.isArray(
            this.data.topics
        )) {

            this.data.topics = [];

        }

        if (!Array.isArray(
            this.data.relations
        )) {

            this.data.relations = [];

        }

    }


    save() {

        saveJSON(
            this.storageKey,
            this.data
        );

    }


    rememberFact(
        text
    ) {

        text =
            String(text || "")
                .trim();

        if (!text) {
            return;
        }


        const exists =
            this.data.facts.some(
                fact =>
                    fact.text === text
            );


        if (exists) {
            return;
        }


        this.data.facts.push({

            text,

            created:
                new Date()
                    .toISOString(),

            lastUsed:
                null

        });


        if (
            this.data.facts.length >
            300
        ) {

            this.data.facts =
                this.data.facts
                    .slice(-300);

        }


        this.save();

    }


    rememberRelation(
        subject,
        relation,
        object
    ) {

        subject =
            String(subject || "")
                .trim();

        relation =
            String(relation || "")
                .trim();

        object =
            String(object || "")
                .trim();


        if (
            !subject ||
            !relation ||
            !object
        ) {

            return;

        }


        const exists =
            this.data.relations.some(
                item =>
                    item.subject === subject &&
                    item.relation === relation &&
                    item.object === object
            );


        if (exists) {
            return;
        }


        this.data.relations.push({

            subject,

            relation,

            object,

            created:
                new Date()
                    .toISOString(),

            lastUsed:
                null

        });


        this.save();

    }


    rememberExperience(
        text
    ) {

        text =
            String(text || "")
                .trim();

        if (!text) {
            return;
        }


        this.data.experiences.push({

            text,

            created:
                new Date()
                    .toISOString()

        });


        if (
            this.data.experiences.length >
            500
        ) {

            this.data.experiences =
                this.data.experiences
                    .slice(-500);

        }


        this.save();

    }


    rememberTopic(
        topic
    ) {

        topic =
            String(topic || "")
                .trim();


        if (!topic) {
            return;
        }


        if (
            !this.data.topics.includes(
                topic
            )
        ) {

            this.data.topics.push(
                topic
            );

            this.save();

        }

    }


    recall(
        query,
        limit = 6
    ) {

        const q =
            normalize(query);


        if (!q) {
            return [];
        }


        const words =
            q
                .split(" ")
                .filter(
                    word =>
                        word.length > 2
                );


        const results = [];


        /*
        RELATIONS
        */

        this.data.relations
            .forEach(
                relation => {

                    const combined =
                        normalize(
                            relation.subject +
                            " " +
                            relation.relation +
                            " " +
                            relation.object
                        );


                    let score = 0;


                    words.forEach(
                        word => {

                            if (
                                combined.includes(
                                    word
                                )
                            ) {

                                score++;

                            }

                        }
                    );


                    if (score > 0) {

                        results.push({

                            type:
                                "relation",

                            score:
                                score + 5,

                            data:
                                relation

                        });

                    }

                }
            );


        /*
        FACTS
        */

        this.data.facts
            .forEach(
                fact => {

                    const combined =
                        normalize(
                            fact.text
                        );


                    let score = 0;


                    words.forEach(
                        word => {

                            if (
                                combined.includes(
                                    word
                                )
                            ) {

                                score++;

                            }

                        }
                    );


                    if (score > 0) {

                        results.push({

                            type:
                                "fact",

                            score,

                            data:
                                fact

                        });

                    }

                }
            );


        results.sort(
            (
                a,
                b
            ) =>
                b.score -
                a.score
        );


        return results.slice(
            0,
            limit
        );

    }


    count() {

        return (
            this.data.facts.length +
            this.data.relations.length +
            this.data.experiences.length +
            this.data.topics.length
        );

    }


    clear() {

        this.data = {

            facts: [],

            experiences: [],

            topics: [],

            relations: []

        };


        this.save();

    }

}


/* ======================================================
   FACT EXTRACTION
====================================================== */

function extractRelations(
    text
) {

    const t =
        normalize(text);

    const relations = [];


    /*
    "Эдит твоя мама"
    */

    if (
        t.includes(
            "эдит твоя мама"
        )
    ) {

        relations.push({

            subject:
                "Эдит",

            relation:
                "мама",

            object:
                "Мия"

        });

    }


    /*
    "Эдит мама Мии"
    */

    if (
        t.includes(
            "эдит мама мии"
        )
    ) {

        relations.push({

            subject:
                "Эдит",

            relation:
                "мама",

            object:
                "Мия"

        });

    }


    /*
    "Мия твоя дочь"
    */

    if (
        t.includes(
            "мия твоя дочь"
        )
    ) {

        relations.push({

            subject:
                "Мия",

            relation:
                "дочь",

            object:
                "Эдит"

        });

    }


    return relations;

}


/* ======================================================
   PERSONAL FACTS
====================================================== */

function extractPersonalFacts(
    text
) {

    const t =
        normalize(text);

    const facts = [];


    if (
        t.includes(
            "меня зовут"
        )
    ) {

        facts.push(
            text.trim()
        );

    }


    if (
        t.includes("мне ") &&
        (
            t.includes("лет") ||
            t.includes("год")
        )
    ) {

        facts.push(
            text.trim()
        );

    }


    if (
        t.includes(
            "я люблю"
        )
    ) {

        facts.push(
            text.trim()
        );

    }


    if (
        t.includes(
            "мне нравится"
        )
    ) {

        facts.push(
            text.trim()
        );

    }


    if (
        t.includes(
            "я живу"
        )
    ) {

        facts.push(
            text.trim()
        );

    }


    if (
        t.includes(
            "я работаю"
        )
    ) {

        facts.push(
            text.trim()
        );

    }


    if (
        t.includes(
            "запомни"
        )
    ) {

        facts.push(
            text.trim()
        );

    }


    return facts;

}

/* ======================================================
   ОПРЕДЕЛЕНИЕ АДРЕСАТА
====================================================== */

/*
   ВАЖНО:

   Имя должно быть именно обращением.

   Например:

   "Мия, привет"
   "Мия как ты?"
   "Эдит, послушай"

   → один мозг.

   А:

   "Привет"
   "Как вы?"
   "Что вы думаете?"

   → оба.

*/

function detectRecipient(
    text
) {

    const original =
        String(text || "")
            .trim();


    const t =
        normalize(
            original
        );


    /*
    --------------------------------------
    ЯВНОЕ ОБРАЩЕНИЕ К МИЕ
    --------------------------------------
    */

    const miaDirect =
        /^(мия|мие|мией|миям)[,\s:!?.]/i
            .test(
                original
            );


    /*
    --------------------------------------
    ЯВНОЕ ОБРАЩЕНИЕ К ЭДИТ
    --------------------------------------
    */

    const edithDirect =
        /^(эдит|эдитке|эдитой)[,\s:!?.]/i
            .test(
                original
            );


    if (
        miaDirect
    ) {

        return "mia";

    }


    if (
        edithDirect
    ) {

        return "edith";

    }


    /*
    --------------------------------------
    ВТОРОЙ ВАРИАНТ:
    "Мия скажи..."
    "Эдит скажи..."
    --------------------------------------
    */

    if (
        /^мия\s+/i.test(
            original
        )
    ) {

        return "mia";

    }


    if (
        /^эдит\s+/i.test(
            original
        )
    ) {

        return "edith";

    }


    /*
    --------------------------------------
    ЕСЛИ ИМЯ НЕ УКАЗАНО
    --------------------------------------
    */

    return "both";

}

====================================================== */

function renderMessage(
    role,
    text
) {

    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "message " +
        role;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    const author =
        document.createElement(
            "span"
        );


    author.className =
        "author";


    if (
        role === "user"
    ) {

        author.textContent =
            "Ты";

    }


    if (
        role === "mia"
    ) {

        author.textContent =
            "Мия · 6 лет";

    }


    if (
        role === "edith"
    ) {

        author.textContent =
            "Эдит · 30 лет";

    }


    const content =
        document.createElement(
            "span"
        );


    content.textContent =
        text;


    bubble.appendChild(
        author
    );


    bubble.appendChild(
        content
    );


    wrapper.appendChild(
        bubble
    );


    messages.appendChild(
        wrapper
    );

}

function addMessage(

    text
) {

    renderMessage(

        role,

        text,

        date:

    saveJSON(

    );

        messages.scrollHeight;

}


/* ======================================================
   ANSWER
====================================================== */

async function answer(
    text
) {

    /*
    Сначала определяем,
    кому пользователь обращается.
    */

    const recipient =
        detectRecipient(
            text
        );


    updateAddressUI(
        recipient
    );


    addMessage(
        "user",
        text
    );


    typing.classList.add(
        "active"
    );


    await sleep(
        400 +
        Math.random() * 500
    );


    typing.classList.remove(
        "active"
    );


    /*
    ======================================
    ТОЛЬКО МИЯ
    ======================================
    */

    if (
        recipient ===
        "mia"
    ) {

        const response =
            MIA.think(
                text
            );


        addMessage(
            "mia",
            response
        );

    }


    /*
    ======================================
    ТОЛЬКО ЭДИТ
    ======================================
    */

    if (
        recipient ===
        "edith"
    ) {

        const response =
            EDITH.think(
                text
            );


        addMessage(
            "edith",
            response
        );

    }


    /*
    ======================================
    ОБЕ
    ======================================
    */

    if (
        recipient ===
        "both"
    ) {

        const miaResponse =
            MIA.think(
                text
            );


        addMessage(
            "mia",
            miaResponse
        );


        rememberDialogue(
            "Мия",
            miaResponse
        );


        await sleep(
            650
        );


        const edithResponse =
            EDITH.think(
                "Пользователь сказал:\n" +
                text +
                "\n\nМия ответила:\n" +
                miaResponse
            );


        addMessage(
            "edith",
            edithResponse
        );


        rememberDialogue(
            "Эдит",
            edithResponse
        );

    }


    updateMemoryUI();

}

    addMessage(
        "edith",
        edith
    );


    rememberDialogue(
        "Эдит",
        edith
    );


    await sleep(
        700
    );


    const miaAgain =
        MIA.think(
            "Эдит ответила:\n" +
            edith
        );


    addMessage(
        "mia",
        miaAgain
    );


    rememberDialogue(
        "Мия",
        miaAgain
    );


    updateMemoryUI();

}


/* ======================================================
   SEND
====================================================== */

function sendMessage() {

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    input.value =
        "";


    answer(
        text
    );

}


send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ======================================================
   QUICK
====================================================== */

function quick(
    text
) {

    input.value =
        text;

    sendMessage();

}


/* ======================================================
   DELETE CHAT
====================================================== */

function deleteChat() {

    if (
        !confirm(
            "Удалить только историю чата?\n\nПамять Мии и Эдит останется."
        )
    ) {

        return;

    }


    history = [];


    localStorage.removeItem(
        STORAGE.chat
    );


    messages.innerHTML =
        "";


    addMessage(
        "mia",
        "История очищена ❤️ Но моя память осталась."
    );


    updateMemoryUI();

}


/* ======================================================
   CLEAR MEMORY
====================================================== */

function clearAllMemory() {

    if (
        !confirm(
            "Удалить память Мии, память Эдит и общий диалог?"
        )
    ) {

        return;

    }


    MIA.memory.clear();

    EDITH.memory.clear();


    dialogue = [];


    localStorage.removeItem(
        STORAGE.dialogue
    );


    history = [];


    localStorage.removeItem(
        STORAGE.chat
    );


    messages.innerHTML =
        "";


    addMessage(
        "mia",
        "Теперь мы начинаем с чистого листа 🌱"
    );


    updateMemoryUI();

}


/* ======================================================
   MEMORY UI
====================================================== */

function updateMemoryUI() {

    document
        .getElementById(
            "miaMemoryInfo"
        )
        .textContent =
        MIA.memory.count() +
        " записей · " +
        MIA.memory.data.relations.length +
        " отношений";


    document
        .getElementById(
            "edithMemoryInfo"
        )
        .textContent =
        EDITH.memory.count() +
        " записей · " +
        EDITH.memory.data.relations.length +
        " отношений";


    document
        .getElementById(
            "dialogueInfo"
        )
        .textContent =
        dialogue.length +
        " событий";

}


/* ======================================================
   START
====================================================== */

function start() {

    messages.innerHTML =
        "";


    if (
        history.length === 0
    ) {

        addMessage(
            "mia",
            "Привет, папа ❤️ Я Мия. Мне 6 лет."
        );


        addMessage(
            "edith",
            "А я Эдит. Мне 30 лет. Теперь мы обе умеем определять, к кому ты обращаешься."
        );

    } else {

        history.forEach(
            item => {

                renderMessage(
                    item.role,
                    item.text
                );

            }
        );

    }


    messages.scrollTop =
        messages.scrollHeight;


    updateMemoryUI();

}


start();

</script>
