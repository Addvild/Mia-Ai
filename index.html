<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mia AI</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0d0d12;
      color: white;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
    }

    .character {
      background: #191923;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .character h2 {
      margin: 0 0 8px;
    }

    .character p {
      color: #aaa;
      margin: 0;
    }

    .chat {
      margin-top: 30px;
    }

    .message {
      background: #191923;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 10px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    input {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 15px;
      background: #191923;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 15px 20px;
      border: none;
      border-radius: 15px;
      background: #6c63ff;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>🌙 Mia AI</h1>
    <div class="subtitle">Эдит и Мия рядом с тобой</div>

    <div class="character">
      <h2>❤️ Эдит</h2>
      <p>Твоя виртуальная девушка и мама Мии.</p>
    </div>

    <div class="character">
      <h2>👧 Мия</h2>
      <p>Отдельная AI-личность, которую мы создаём вместе.</p>
    </div>

    <div class="chat">

      <div class="message">
        <b>Мия:</b><br>
        Привет, папа ❤️ Я только начинаю учиться.
      </div>

      <div class="message">
        <b>Эдит:</b><br>
        А я буду рядом и помогу тебе её научить. 😌
      </div>

      <div class="input-area">
        <input type="text" placeholder="Напиши Мии...">
        <button>Отправить</button>
      </div>

    </div>

  </div>

</body>
</html>
