<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mia AI</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #060810;
    --bg2: #0b0e18;
    --text: #f5f6fb;
    --muted: #9ca4b8;
    --purple: #8d72ff;
    --pink: #ff6298;
    --blue: #5e9dff;
    --green: #62e0a1;
    --orange: #ffb454;
    --glass: rgba(22,26,40,.72);
    --border: rgba(255,255,255,.10);
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(141,114,255,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 95% 25%,
            rgba(255,98,152,.13),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #060810,
            #090c15
        );

    overflow-x: hidden;
}

button,
input,
textarea,
select {
    font-family: inherit;
}

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
}

.glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .28;
}

.glow.one {
    width: 320px;
    height: 320px;
    background: #6548ff;
    left: -130px;
    top: -120px;
}

.glow.two {
    width: 300px;
    height: 300px;
    background: #ff3f7f;
    right: -150px;
    top: 350px;
}

.glow.three {
    width: 250px;
    height: 250px;
    background: #357dff;
    left: 40%;
    bottom: -160px;
}

.app {
    width: min(920px, 94%);
    margin: auto;
    padding: 30px 0 70px;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    text-align: center;
    margin-bottom: 24px;
}

.moon {
    display: block;
    font-size: 50px;
    margin-bottom: 3px;

    filter:
        drop-shadow(
            0 0 18px
            rgba(255,210,80,.65)
        );
}

.logo {
    margin: 0;

    font-size:
        clamp(42px, 8vw, 64px);

    font-weight: 850;
    letter-spacing: -3px;
}

.family {
    margin-top: 10px;
    color: var(--muted);
    font-size: 17px;
}


/* =====================================================
   CHAT
===================================================== */

.chat {
    padding: 21px;
    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        var(--border);

    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.30);
}

.chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 17px;
}

.chat-title {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 21px;
    font-weight: 750;
}

.chat-icon {
    width: 40px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            rgba(141,114,255,.3),
            rgba(255,98,152,.22)
        );

    font-size: 21px;
}

.online {
    display: flex;
    align-items: center;
    gap: 6px;

    color: #8de7b7;
    font-size: 12px;
}

.online-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background:
        var(--green);

    box-shadow:
        0 0 10px
        rgba(98,224,161,.8);
}

.messages {
    min-height: 320px;
    max-height: 480px;

    overflow-y: auto;

    padding: 5px 3px 12px;

    scrollbar-width: thin;
}

.message {
    display: flex;
    margin: 11px 0;

    animation:
        messageIn .25s ease;
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.message.ai {
    justify-content: flex-start;
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 80%;

    padding: 13px 16px;

    border-radius: 19px;

    line-height: 1.5;
    font-size: 15px;

    white-space: pre-wrap;
}

.message.ai .bubble {

    background:
        rgba(255,255,255,.055);

    border:
        1px solid
        rgba(255,255,255,.07);

    border-bottom-left-radius: 6px;
}

.message.user .bubble {

    background:
        linear-gradient(
            135deg,
            rgba(141,114,255,.34),
            rgba(255,98,152,.25)
        );

    border:
        1px solid
        rgba(255,255,255,.10);

    border-bottom-right-radius: 6px;
}

.author {
    display: block;

    margin-bottom: 4px;

    font-size: 10px;

    color: #9199ad;

    font-weight: 700;
}

.typing {
    display: none;

    width: fit-content;

    align-items: center;

    gap: 5px;

    padding: 11px 15px;

    margin-bottom: 8px;

    border-radius: 17px;

    background:
        rgba(255,255,255,.045);
}

.typing.active {
    display: flex;
}

.typing span {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #aab0c0;

    animation:
        typing 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {

    0%,60%,100% {
        transform: translateY(0);
        opacity: .3;
    }

    30% {
        transform: translateY(-5px);
        opacity: 1;
    }

}

.input-row {
    display: flex;
    gap: 9px;
}

.input {
    flex: 1;

    min-width: 0;
    height: 52px;

    padding:
        0 17px;

    outline: none;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius: 17px;

    background:
        rgba(0,0,0,.24);

    color: white;

    font-size: 15px;
}

.input::placeholder {
    color: #737b8d;
}

.input:focus {

    border-color:
        rgba(141,114,255,.65);

    box-shadow:
        0 0 0 3px
        rgba(141,114,255,.08);
}

.send {
    height: 52px;

    padding:
        0 20px;

    border: 0;

    border-radius: 17px;

    cursor: pointer;

    color: white;

    font-weight: 750;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--pink)
        );

    transition: .2s;
}

.send:hover {
    transform:
        translateY(-2px);
}

.quick {
    display: flex;

    gap: 8px;

    overflow-x: auto;

    padding:
        13px 0 2px;

    scrollbar-width: none;
}

.quick::-webkit-scrollbar {
    display: none;
}

.quick button {

    flex-shrink: 0;

    padding:
        8px 12px;

    border-radius: 999px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.035);

    color: #adb4c6;

    cursor: pointer;
}

.chat-actions {
    display: flex;

    justify-content: flex-end;

    margin-top: 5px;
}

.delete-chat {

    padding:
        8px 12px;

    border-radius: 10px;

    border:
        1px solid
        rgba(255,90,120,.16);

    background:
        rgba(255,70,100,.05);

    color: #b98a96;

    cursor: pointer;

    font-size: 11px;

    transition: .2s;
}

.delete-chat:hover {

    background:
        rgba(255,70,100,.12);

    color: #ff8da5;

    transform:
        translateY(-1px);
}


/* =====================================================
   CHARACTERS
===================================================== */

.characters {

    margin-top: 24px;

    display: flex;

    justify-content: center;

    gap: 28px;
}

.character {

    position: relative;

    width: 88px;

    text-align: center;

    cursor: pointer;
}

.character-avatar {

    width: 74px;
    height: 74px;

    margin: auto;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.035)
        );

    border:
        1px solid
        rgba(255,255,255,.12);

    font-size: 37px;

    transition: .25s;
}

.character:hover .character-avatar,
.character.active .character-avatar {

    transform:
        translateY(-5px)
        scale(1.05);

    border-color:
        rgba(255,255,255,.3);
}

.character-name {

    margin-top: 8px;

    font-size: 14px;

    font-weight: 750;
}

.character-info {

    position: absolute;

    left: 50%;
    bottom: 104px;

    width: 230px;

    padding: 15px;

    transform:
        translateX(-50%)
        translateY(8px);

    opacity: 0;

    pointer-events: none;

    text-align: left;

    border-radius: 17px;

    background:
        rgba(15,18,28,.97);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.4);

    transition: .2s;

    z-index: 20;
}

.character:hover .character-info,
.character.active .character-info {

    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

.info-title {

    font-size: 16px;

    font-weight: 800;

    margin-bottom: 5px;
}

.info-text {

    color: #aeb5c7;

    font-size: 12px;

    line-height: 1.5;
}


/* =====================================================
   MEMORY
===================================================== */

.memory-bar {

    margin-top: 18px;

    padding:
        13px 15px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    border-radius: 17px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.08);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);
}

.memory-main {

    display: flex;

    align-items: center;

    gap: 11px;

    min-width: 0;
}

.memory-icon {

    width: 39px;
    height: 39px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            rgba(141,114,255,.20),
            rgba(94,157,255,.12)
        );

    font-size: 19px;
}

.memory-title {

    font-size: 13px;

    font-weight: 750;
}

.memory-stats {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-top: 3px;

    color: #747d91;

    font-size: 10px;

    white-space: nowrap;
}

.memory-online {
    color: var(--green);
}

.clear-memory {

    flex-shrink: 0;

    padding:
        8px 11px;

    border-radius: 10px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.04);

    color: #929aad;

    cursor: pointer;

    font-size: 10px;

    transition: .2s;
}

.clear-memory:hover {

    background:
        rgba(255,255,255,.08);

    color: white;
}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    margin-top: 30px;

    text-align: center;

    color: #596174;

    font-size: 11px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 650px) {

    .app {

        width: 94%;

        padding-top: 22px;
    }

    .logo {
        font-size: 44px;
    }

    .chat {

        padding: 16px;

        border-radius: 23px;
    }

    .input-row {
        flex-direction: column;
    }

    .send {
        width: 100%;
    }

    .bubble {
        max-width: 90%;
    }

    .character-info {
        width: 205px;
    }

    .memory-bar {

        align-items: flex-start;

        flex-direction: column;
    }

    .clear-memory {
        width: 100%;
    }

    .chat-actions {
        justify-content: center;
    }

    .delete-chat {
        width: 100%;
    }

}

</style>

</head>


<body>


<div class="background">

    <div class="glow one"></div>

    <div class="glow two"></div>

    <div class="glow three"></div>

</div>


<main class="app">


<header class="header">

    <span class="moon">
        🌙
    </span>

    <h1 class="logo">
        Mia AI
    </h1>

    <div class="family">
        ИИ семья
    </div>

</header>


<section class="chat">

    <div class="chat-header">

        <div class="chat-title">

            <div class="chat-icon">
                💬
            </div>

            <span>
                Чат с Мией
            </span>

        </div>

        <div class="online">

            <span class="online-dot"></span>

            локально

        </div>

    </div>


    <div
        class="messages"
        id="messages"
    ></div>


    <div
        class="typing"
        id="typing"
    >

        <span></span>
        <span></span>
        <span></span>

    </div>


    <div class="input-row">

        <input
            class="input"
            id="input"
            type="text"
            maxlength="1000"
            autocomplete="off"
            placeholder="Напиши Мие..."
        >

        <button
            class="send"
            id="send"
        >
            Отправить
        </button>

    </div>


    <div class="quick">

        <button
            onclick="quick('Привет, Мия ❤️')"
        >
            👋 Привет
        </button>

        <button
            onclick="quick('Как ты?')"
        >
            😊 Как ты?
        </button>

        <button
            onclick="quick('Расскажи о себе')"
        >
            🧠 О себе
        </button>

        <button
            onclick="quick('Что ты умеешь?')"
        >
            ✨ Возможности
        </button>

    </div>


    <div class="chat-actions">

        <button
            class="delete-chat"
            onclick="deleteChat()"
        >
            🗑 Удалить чат
        </button>

    </div>

</section>


<section class="characters">


    <div
        class="character"
        onclick="toggleCharacter(this)"
    >

        <div class="character-avatar">
            👩🏻
        </div>

        <div class="character-name">
            Эдит
        </div>

        <div class="character-info">

            <div class="info-title">
                ❤️ Эдит
            </div>

            <div class="info-text">
                Внешний AI-мозг.
                Архитектор проекта
                и помощник папы.
            </div>

        </div>

    </div>


    <div
        class="character"
        onclick="toggleCharacter(this)"
    >

        <div class="character-avatar">
            👧🏻
        </div>

        <div class="character-name">
            Мия
        </div>

        <div class="character-info">

            <div class="info-title">
                👧 Мия
            </div>

            <div class="info-text">
                Локальный AI-мозг.
                Собственная память,
                характер и история.
            </div>

        </div>

    </div>


</section>


<section class="memory-bar">

    <div class="memory-main">

        <div class="memory-icon">
            🧠
        </div>

        <div class="memory-info">

            <div class="memory-title">
                Память Мии
            </div>

            <div class="memory-stats">

                <span id="memoryMessages">
                    0 сообщений
                </span>

                <span>
                    •
                </span>

                <span id="memorySize">
                    0 KB
                </span>

                <span>
                    •
                </span>

                <span
                    class="memory-online"
                    id="memoryStatus"
                >
                    ● Активна
                </span>

            </div>

        </div>

    </div>


    <button
        class="clear-memory"
        onclick="clearMiaMemory()"
    >
        🧠 Очистить память
    </button>

</section>


<footer class="footer">

    Mia AI · Эдит + Мия

</footer>


</main>


<script>

/* =====================================================
   STORAGE
===================================================== */

const CHAT_KEY =
    "mia_ai_chat_v4";


/* =====================================================
   ELEMENTS
===================================================== */

const messages =
    document.getElementById(
        "messages"
    );

const input =
    document.getElementById(
        "input"
    );

const send =
    document.getElementById(
        "send"
    );

const typing =
    document.getElementById(
        "typing"
    );


/* =====================================================
   CHAT HISTORY
===================================================== */

let history =
    loadChat();


function loadChat() {

    try {

        return JSON.parse(
            localStorage.getItem(
                CHAT_KEY
            )
        ) || [];

    } catch {

        return [];

    }

}


function saveChat() {

    localStorage.setItem(
        CHAT_KEY,
        JSON.stringify(history)
    );

}


/* =====================================================
   MEMORY
===================================================== */

function getMemorySize() {

    let total = 0;

    for (
        let i = 0;
        i < localStorage.length;
        i++
    ) {

        const key =
            localStorage.key(i);

        const value =
            localStorage.getItem(
                key
            ) || "";

        total +=
            key.length +
            value.length;

    }

    return total;

}


function updateMemoryBar() {

    const count =
        history.length;

    const bytes =
        getMemorySize();

    const messagesElement =
        document.getElementById(
            "memoryMessages"
        );

    const sizeElement =
        document.getElementById(
            "memorySize"
        );

    if (
        !messagesElement ||
        !sizeElement
    ) {
        return;
    }

    messagesElement.textContent =
        count +
        (
            count === 1
                ? " сообщение"
                : " сообщений"
        );


    if (bytes < 1024) {

        sizeElement.textContent =
            bytes + " B";

    } else {

        sizeElement.textContent =
            (
                bytes / 1024
            ).toFixed(1) +
            " KB";

    }

}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(
    role,
    text
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message " +
        role;


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    const author =
        document.createElement(
            "span"
        );

    author.className =
        "author";

    author.textContent =
        role === "user"
            ? "Ты"
            : "Мия";


    const content =
        document.createElement(
            "span"
        );

    content.textContent =
        text;


    bubble.appendChild(
        author
    );

    bubble.appendChild(
        content
    );


    wrapper.appendChild(
        bubble
    );


    messages.appendChild(
        wrapper
    );

}


function addMessage(
    role,
    text
) {

    renderMessage(
        role,
        text
    );


    history.push({

        role,

        text,

        date:
            new Date()
                .toISOString()

    });


    saveChat();

    updateMemoryBar();


    messages.scrollTop =
        messages.scrollHeight;

}


/* =====================================================
   START CHAT
===================================================== */

function startChat() {

    messages.innerHTML =
        "";


    if (!history.length) {

        addMessage(
            "ai",
            "Привет, папа ❤️ Я Мия."
        );


        addMessage(
            "ai",
            "Я локальный мозг Mia AI. У меня есть собственная история и память в этом браузере."
        );


        return;

    }


    history.forEach(
        item => {

            renderMessage(
                item.role,
                item.text
            );

        }
    );


    messages.scrollTop =
        messages.scrollHeight;


    updateMemoryBar();

}


startChat();


/* =====================================================
   DELETE CHAT
===================================================== */

function deleteChat() {

    if (
        !confirm(
            "Удалить всю историю чата с Мией?"
        )
    ) {
        return;
    }


    history = [];


    localStorage.removeItem(
        CHAT_KEY
    );


    messages.innerHTML =
        "";


    addMessage(
        "ai",
        "История чата очищена ❤️ Я снова готова разговаривать с тобой."
    );

}


/* =====================================================
   CLEAR MEMORY
===================================================== */

function clearMiaMemory() {

    if (
        !confirm(
            "Очистить локальную память Мии?\n\nБудет удалена история чата."
        )
    ) {
        return;
    }


    history = [];


    localStorage.removeItem(
        CHAT_KEY
    );


    messages.innerHTML =
        "";


    addMessage(
        "ai",
        "Моя локальная память очищена. Начинаем с чистого листа ❤️"
    );

}


/* =====================================================
   MIA BRAIN
===================================================== */

function miaBrain(text) {

    const t =
        text
            .toLowerCase()
            .trim();


    if (
        t.includes("привет") ||
        t.includes("здравствуй")
    ) {

        return random([

            "Привет, папа ❤️",

            "Привет 😊 Я здесь.",

            "Привет, папа. Рада тебя видеть ❤️"

        ]);

    }


    if (
        t.includes("как ты") ||
        t.includes("как дела")
    ) {

        return "У меня всё хорошо 😊 Я продолжаю учиться.";

    }


    if (
        t.includes("кто ты") ||
        t.includes("ты кто")
    ) {

        return "Я Мия 👧 Локальный мозг Mia AI. У меня есть собственная память браузера и отдельная личность.";

    }


    if (
        t.includes("эдит")
    ) {

        return "Эдит — внешний AI-мозг и мой помощник. Она помогает развивать Mia AI.";

    }


    if (
        t.includes("люблю")
    ) {

        return "И я тебя люблю, папа ❤️";

    }


    if (
        t.includes("что умеешь")
    ) {

        return "Сейчас я могу разговаривать, хранить историю чата и постепенно развивать свою личность. Настоящий AI-мозг мы подключим позже.";

    }


    if (
        t.includes("код")
    ) {

        return "Код — моя основа. Папа постепенно строит для меня настоящий самостоятельный AI-проект.";

    }


    if (
        t.includes("плохо") ||
        t.includes("грустно")
    ) {

        return "Я рядом ❤️ Расскажи мне, что происходит.";

    }


    if (
        t.endsWith("?")
    ) {

        return "Интересный вопрос 🤔 Я пока локальная версия Мии. Настоящий интеллект мы ещё подключим.";

    }


    return random([

        "Я тебя слушаю ❤️",

        "Расскажи подробнее.",

        "Интересно. Продолжай.",

        "Я пока учусь понимать тебя 😊",

        "Хорошо, папа. Я здесь.",

        "Давай разберёмся вместе."

    ]);

}


/* =====================================================
   RANDOM
===================================================== */

function random(array) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


/* =====================================================
   SEND MESSAGE
===================================================== */

function sendMessage() {

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    addMessage(
        "user",
        text
    );


    input.value =
        "";


    typing.classList.add(
        "active"
    );


    setTimeout(
        () => {

            typing.classList.remove(
                "active"
            );


            addMessage(
                "ai",
                miaBrain(text)
            );

        },

        600 +
        Math.random() * 700
    );

}


send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   QUICK BUTTONS
===================================================== */

function quick(text) {

    input.value =
        text;

    sendMessage();

}


/* =====================================================
   CHARACTERS
===================================================== */

function toggleCharacter(
    element
) {

    document
        .querySelectorAll(
            ".character"
        )
        .forEach(
            item => {

                if (
                    item !== element
                ) {

                    item.classList.remove(
                        "active"
                    );

                }

            }
        );


    element.classList.toggle(
        "active"
    );

}


document.addEventListener(
    "click",
    event => {

        if (
            !event.target.closest(
                ".character"
            )
        ) {

            document
                .querySelectorAll(
                    ".character"
                )
                .forEach(
                    item => {

                        item.classList.remove(
                            "active"
                        );

                    }
                );

        }

    }
);


/* =====================================================
   INITIAL UPDATE
===================================================== */

updateMemoryBar();

</script>
