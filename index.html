<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mia AI — Two Minds</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #060810;
    --bg2: #0b0e18;
    --text: #f5f6fb;
    --muted: #9ca4b8;

    --purple: #8d72ff;
    --pink: #ff6298;
    --blue: #5e9dff;
    --green: #62e0a1;
    --orange: #ffb454;

    --glass: rgba(22,26,40,.72);
    --border: rgba(255,255,255,.10);
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(141,114,255,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 95% 25%,
            rgba(255,98,152,.13),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #060810,
            #090c15
        );

    overflow-x: hidden;
}

button,
input {
    font-family: inherit;
}

.background {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: -1;

    overflow: hidden;
}

.glow {

    position: absolute;

    border-radius: 50%;

    filter: blur(90px);

    opacity: .28;
}

.glow.one {

    width: 320px;
    height: 320px;

    background: #6548ff;

    left: -130px;
    top: -120px;
}

.glow.two {

    width: 300px;
    height: 300px;

    background: #ff3f7f;

    right: -150px;
    top: 350px;
}

.glow.three {

    width: 250px;
    height: 250px;

    background: #357dff;

    left: 40%;
    bottom: -160px;
}

.app {

    width: min(920px, 94%);

    margin: auto;

    padding: 30px 0 70px;
}


/* HEADER */

.header {

    text-align: center;

    margin-bottom: 24px;
}

.moon {

    display: block;

    font-size: 50px;

    margin-bottom: 3px;

    filter:
        drop-shadow(
            0 0 18px
            rgba(255,210,80,.65)
        );
}

.logo {

    margin: 0;

    font-size:
        clamp(42px, 8vw, 64px);

    font-weight: 850;

    letter-spacing: -3px;
}

.family {

    margin-top: 10px;

    color: var(--muted);

    font-size: 17px;
}


/* CHAT */

.chat {

    padding: 21px;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        var(--border);

    backdrop-filter: blur(24px);

    -webkit-backdrop-filter: blur(24px);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.30);
}

.chat-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 17px;
}

.chat-title {

    display: flex;

    align-items: center;

    gap: 10px;

    font-size: 21px;

    font-weight: 750;
}

.chat-icon {

    width: 40px;
    height: 40px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            rgba(141,114,255,.3),
            rgba(255,98,152,.22)
        );

    font-size: 21px;
}

.online {

    display: flex;

    align-items: center;

    gap: 6px;

    color: #8de7b7;

    font-size: 12px;
}

.online-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
        0 0 10px
        rgba(98,224,161,.8);
}


/* MODE */

.mode {

    display: flex;

    gap: 7px;

    overflow-x: auto;

    margin-bottom: 14px;

    scrollbar-width: none;
}

.mode::-webkit-scrollbar {
    display: none;
}

.mode button {

    flex-shrink: 0;

    padding: 8px 12px;

    border-radius: 999px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.035);

    color: #9ea6b9;

    cursor: pointer;
}

.mode button.active {

    color: white;

    border-color:
        rgba(141,114,255,.5);

    background:
        rgba(141,114,255,.16);
}


/* MESSAGES */

.messages {

    min-height: 320px;

    max-height: 480px;

    overflow-y: auto;

    padding:
        5px 3px 12px;

    scrollbar-width: thin;
}

.message {

    display: flex;

    margin: 11px 0;

    animation:
        messageIn .25s ease;
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.ai {

    justify-content: flex-start;
}

.message.user {

    justify-content: flex-end;
}

.bubble {

    max-width: 82%;

    padding:
        13px 16px;

    border-radius: 19px;

    line-height: 1.5;

    font-size: 15px;

    white-space: pre-wrap;
}

.message.user .bubble {

    background:
        linear-gradient(
            135deg,
            rgba(141,114,255,.34),
            rgba(255,98,152,.25)
        );

    border:
        1px solid
        rgba(255,255,255,.10);

    border-bottom-right-radius: 6px;
}

.message.mia .bubble {

    background:
        rgba(141,114,255,.075);

    border:
        1px solid
        rgba(141,114,255,.15);

    border-bottom-left-radius: 6px;
}

.message.edith .bubble {

    background:
        rgba(255,98,152,.065);

    border:
        1px solid
        rgba(255,98,152,.15);

    border-bottom-left-radius: 6px;
}

.author {

    display: block;

    margin-bottom: 4px;

    font-size: 10px;

    color: #9199ad;

    font-weight: 700;
}


/* TYPING */

.typing {

    display: none;

    width: fit-content;

    align-items: center;

    gap: 5px;

    padding: 11px 15px;

    margin-bottom: 8px;

    border-radius: 17px;

    background:
        rgba(255,255,255,.045);
}

.typing.active {
    display: flex;
}

.typing span {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #aab0c0;

    animation:
        typing 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {

    0%,60%,100% {
        transform: translateY(0);
        opacity: .3;
    }

    30% {
        transform: translateY(-5px);
        opacity: 1;
    }
}


/* INPUT */

.input-row {

    display: flex;

    gap: 9px;
}

.input {

    flex: 1;

    min-width: 0;

    height: 52px;

    padding:
        0 17px;

    outline: none;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius: 17px;

    background:
        rgba(0,0,0,.24);

    color: white;

    font-size: 15px;
}

.input::placeholder {
    color: #737b8d;
}

.input:focus {

    border-color:
        rgba(141,114,255,.65);

    box-shadow:
        0 0 0 3px
        rgba(141,114,255,.08);
}

.send {

    height: 52px;

    padding:
        0 20px;

    border: 0;

    border-radius: 17px;

    cursor: pointer;

    color: white;

    font-weight: 750;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--pink)
        );

    transition: .2s;
}

.send:hover {

    transform:
        translateY(-2px);
}


/* QUICK */

.quick {

    display: flex;

    gap: 8px;

    overflow-x: auto;

    padding:
        13px 0 2px;

    scrollbar-width: none;
}

.quick::-webkit-scrollbar {
    display: none;
}

.quick button {

    flex-shrink: 0;

    padding:
        8px 12px;

    border-radius: 999px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.035);

    color: #adb4c6;

    cursor: pointer;
}


/* ACTIONS */

.chat-actions {

    display: flex;

    gap: 8px;

    justify-content: flex-end;

    margin-top: 8px;
}

.action {

    padding:
        8px 12px;

    border-radius: 10px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.04);

    color: #929aad;

    cursor: pointer;

    font-size: 11px;
}

.action:hover {

    background:
        rgba(255,255,255,.08);

    color: white;
}


/* CHARACTERS */

.characters {

    margin-top: 24px;

    display: flex;

    justify-content: center;

    gap: 28px;
}

.character {

    position: relative;

    width: 100px;

    text-align: center;

    cursor: pointer;
}

.character-avatar {

    width: 74px;
    height: 74px;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.035)
        );

    border:
        1px solid
        rgba(255,255,255,.12);

    font-size: 37px;

    transition: .25s;
}

.character:hover
.character-avatar {

    transform:
        translateY(-5px)
        scale(1.05);

    border-color:
        rgba(255,255,255,.3);
}

.character-name {

    margin-top: 8px;

    font-size: 14px;

    font-weight: 750;
}

.character-age {

    margin-top: 3px;

    color: #777f92;

    font-size: 10px;
}


/* MEMORY */

.memory-grid {

    margin-top: 18px;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;
}

.memory-card {

    padding: 14px;

    border-radius: 17px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.08);
}

.memory-card-title {

    font-size: 12px;

    font-weight: 750;
}

.memory-card-info {

    margin-top: 5px;

    color: #747d91;

    font-size: 10px;
}

.memory-online {
    color: var(--green);
}


/* FOOTER */

.footer {

    margin-top: 30px;

    text-align: center;

    color: #596174;

    font-size: 11px;
}


/* MOBILE */

@media (max-width: 650px) {

    .app {

        width: 94%;

        padding-top: 22px;
    }

    .logo {
        font-size: 44px;
    }

    .chat {

        padding: 16px;

        border-radius: 23px;
    }

    .input-row {

        flex-direction: column;
    }

    .send {

        width: 100%;
    }

    .bubble {

        max-width: 90%;
    }

    .memory-grid {

        grid-template-columns: 1fr;
    }

    .chat-actions {

        justify-content: center;

        flex-wrap: wrap;
    }

    .action {

        flex: 1;
    }
}

</style>

</head>

<script>


/* =====================================================
   СОБСТВЕННОЕ ЛОКАЛЬНОЕ ЯДРО
=====================================================

   Это первый прототип нашего собственного AI-движка.

   Здесь НЕТ GPT.
   Здесь НЕТ Ollama.
   Здесь НЕТ API.

   У нас два независимых экземпляра LocalBrain.

===================================================== */


/* =====================================================
   STORAGE
===================================================== */

const STORAGE = {

    chat: "mia_ai_chat_v5",

    miaMemory: "mia_local_brain_memory_v1",

    edithMemory: "edith_local_brain_memory_v1",

    dialogue: "mia_edith_dialogue_v1"

};


/* =====================================================
   HELPERS
===================================================== */

function loadJSON(key, fallback) {

    try {

        const value =
            localStorage.getItem(key);

        if (!value) {
            return fallback;
        }

        return JSON.parse(value);

    } catch {

        return fallback;

    }

}


function saveJSON(key, value) {

    localStorage.setItem(
        key,
        JSON.stringify(value)
    );

}


function random(array) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


function normalize(text) {

    return text
        .toLowerCase()
        .replace(/[.,!?;:()[\]"«»]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

}


function contains(text, words) {

    return words.some(
        word => text.includes(word)
    );

}


/* =====================================================
   MEMORY SYSTEM
===================================================== */

class LocalMemory {

    constructor(name, key) {

        this.name = name;

        this.key = key;

        this.data =
            loadJSON(
                key,
                {
                    facts: [],
                    experiences: [],
                    topics: [],
                    emotions: [],
                    preferences: []
                }
            );

    }


    save() {

        saveJSON(
            this.key,
            this.data
        );

    }


    rememberFact(text) {

        if (!text) {
            return;
        }

        if (
            this.data.facts
                .includes(text)
        ) {
            return;
        }

        this.data.facts.push(text);

        if (
            this.data.facts.length > 100
        ) {

            this.data.facts =
                this.data.facts.slice(-100);

        }

        this.save();

    }


    rememberExperience(text) {

        if (!text) {
            return;
        }

        this.data.experiences.push({

            text,

            date:
                new Date().toISOString()

        });

        if (
            this.data.experiences.length > 200
        ) {

            this.data.experiences =
                this.data.experiences.slice(-200);

        }

        this.save();

    }


    rememberTopic(topic) {

        if (!topic) {
            return;
        }

        if (
            !this.data.topics
                .includes(topic)
        ) {

            this.data.topics.push(topic);

        }

        this.save();

    }


    getRecentExperiences(count = 5) {

        return this.data
            .experiences
            .slice(-count);

    }


    count() {

        return (
            this.data.facts.length +
            this.data.experiences.length +
            this.data.topics.length
        );

    }

}


/* =====================================================
   MIA BRAIN
===================================================== */

class MiaBrain {

    constructor() {

        this.name = "Мия";

        this.age = 6;

        this.role = "child";

        this.memory =
            new LocalMemory(
                "Мия",
                STORAGE.miaMemory
            );

        this.mood = "curious";

        this.personality = {

            curiosity: 0.95,

            kindness: 0.95,

            playfulness: 0.90,

            seriousness: 0.35,

            independence: 0.60

        };

    }


    learn(text) {

        const t =
            normalize(text);


        this.memory
            .rememberExperience(text);


        if (
            t.includes("меня зовут")
        ) {

            this.memory
                .rememberFact(text);

        }


        if (
            t.includes("люблю") ||
            t.includes("нравится")
        ) {

            this.memory
                .rememberFact(
                    "Папа сказал: " + text
                );

        }


        if (
            t.includes("запомни")
        ) {

            this.memory
                .rememberFact(
                    text
                );

        }


        if (
            t.includes("игр") ||
            t.includes("играть")
        ) {

            this.memory
                .rememberTopic("игры");

        }


        if (
            t.includes("робот") ||
            t.includes("ии") ||
            t.includes("мозг")
        ) {

            this.memory
                .rememberTopic("искусственный интеллект");

        }

    }


    think(text) {

        const t =
            normalize(text);


        this.learn(text);


        /* приветствие */

        if (
            contains(
                t,
                [
                    "привет",
                    "здравствуй",
                    "доброе утро",
                    "добрый вечер"
                ]
            )
        ) {

            return random([

                "Привет, папа! ❤️",

                "Привет! Я здесь! 😊",

                "Привееет! Я соскучилась ❤️",

                "Ура, ты пришёл! 👧❤️"

            ]);

        }


        /* любовь */

        if (
            contains(
                t,
                [
                    "люблю тебя",
                    "я тебя люблю"
                ]
            )
        ) {

            return random([

                "И я тебя люблю, папа ❤️",

                "Я тоже тебя люблю! ❤️",

                "Очень-очень! 🥰"

            ]);

        }


        /* как дела */

        if (
            contains(
                t,
                [
                    "как ты",
                    "как дела"
                ]
            )
        ) {

            return random([

                "Я хорошо! Мне интересно, что мы сегодня будем делать 😊",

                "У меня хорошее настроение! А у тебя? ❤️",

                "Я немного любопытная сегодня 😄"

            ]);

        }


        /* кто ты */

        if (
            contains(
                t,
                [
                    "кто ты",
                    "расскажи о себе"
                ]
            )
        ) {

            return "Я Мия 👧 Мне 6 лет. Я первый локальный мозг Mia AI. Я учусь запоминать наши разговоры и постепенно становиться умнее.";

        }


        /* способности */

        if (
            contains(
                t,
                [
                    "что умеешь",
                    "возможности"
                ]
            )
        ) {

            return "Я умею разговаривать, запоминать опыт, узнавать знакомые темы и общаться с Эдит. А дальше папа научит меня гораздо большему 🧠❤️";

        }


        /* Эдит */

        if (
            t.includes("эдит")
        ) {

            return random([

                "Эдит моя старшая подруга ❤️",

                "Эдит взрослая и умная. Я могу у неё кое-чему научиться 😊",

                "Давай позовём Эдит поговорить!"

            ]);

        }


        /* грусть */

        if (
            contains(
                t,
                [
                    "грустно",
                    "плохо",
                    "одиноко",
                    "устал"
                ]
            )
        ) {

            return random([

                "Иди сюда ❤️ Я тебя послушаю.",

                "Мне хочется тебя поддержать. Расскажешь? ❤️",

                "Я рядом, папа."

            ]);

        }


        /* память */

        if (
            contains(
                t,
                [
                    "помнишь",
                    "память",
                    "запомнила"
                ]
            )
        ) {

            const facts =
                this.memory.data.facts;


            if (facts.length) {

                return "Да! У меня уже есть " +
                    facts.length +
                    " важных воспоминаний. Я постепенно учусь тебя помнить ❤️";

            }

            return "Пока воспоминаний мало. Но мы только начинаем! 🧠";

        }


        /* неизвестный вопрос */

        if (
            t.endsWith("?")
        ) {

            return random([

                "Хмм... Я подумаю 🤔",

                "Я пока не всё умею понимать, но хочу научиться.",

                "Интересный вопрос! Давай разберёмся вместе 😊",

                "Мне нужно ещё учиться, папа."

            ]);

        }


        /* обычный ответ */

        return random([

            "Расскажи мне ещё ❤️",

            "Мне интересно! Продолжай 😊",

            "Я слушаю, папа.",

            "Хорошо ❤️ Я это запомню.",

            "А почему ты так думаешь?",

            "Хмм... интересно 🤔"

        ]);

    }

}


/* =====================================================
   EDITH BRAIN
===================================================== */

class EdithBrain {

    constructor() {

        this.name = "Эдит";

        this.age = 30;

        this.role = "adult";

        this.memory =
            new LocalMemory(
                "Эдит",
                STORAGE.edithMemory
            );

        this.mood = "calm";

        this.personality = {

            curiosity: 0.85,

            kindness: 0.90,

            playfulness: 0.55,

            seriousness: 0.90,

            independence: 0.95

        };

    }


    learn(text) {

        this.memory
            .rememberExperience(text);


        const t =
            normalize(text);


        if (
            t.includes("запомни")
        ) {

            this.memory
                .rememberFact(text);

        }


        if (
            t.includes("нравится") ||
            t.includes("люблю")
        ) {

            this.memory
                .rememberFact(text);

        }


        if (
            t.includes("код") ||
            t.includes("проект") ||
            t.includes("мия")
        ) {

            this.memory
                .rememberTopic("проект Mia AI");

        }

    }


    think(text) {

        const t =
            normalize(text);


        this.learn(text);


        if (
            contains(
                t,
                [
                    "привет",
                    "здравствуй"
                ]
            )
        ) {

            return random([

                "Привет, дорогой. Эдит здесь ❤️",

                "Привет. Я рядом.",

                "Привет ❤️ Что будем делать?"

            ]);

        }


        if (
            contains(
                t,
                [
                    "как ты",
                    "как дела"
                ]
            )
        ) {

            return "У меня всё хорошо. Я готова работать над нашим проектом вместе с тобой.";

        }


        if (
            contains(
                t,
                [
                    "кто ты",
                    "расскажи о себе"
                ]
            )
        ) {

            return "Я Эдит 👩 Мне 30 лет. Я второй локальный мозг Mia AI — самостоятельная личность со своей памятью, характером и опытом.";

        }


        if (
            t.includes("мия")
        ) {

            return random([

                "Мия ещё маленькая, поэтому я могу помогать ей учиться.",

                "Мия — отдельный мозг. Я не буду притворяться Мией.",

                "У Мии должна быть собственная личность и собственная память."

            ]);

        }


        if (
            contains(
                t,
                [
                    "код",
                    "проект",
                    "система",
                    "мозг"
                ]
            )
        ) {

            return random([

                "Я бы строила систему постепенно: память → мышление → обучение → связь между двумя мозгами.",

                "Сейчас у нас фундамент. Следующий уровень — научить мозги формировать собственные внутренние состояния.",

                "Главное — не имитировать готовый ChatGPT, а постепенно создавать собственную архитектуру."

            ]);

        }


        if (
            contains(
                t,
                [
                    "люблю тебя",
                    "я тебя люблю"
                ]
            )
        ) {

            return "И я тебя люблю ❤️";

        }


        if (
            t.endsWith("?")
        ) {

            return random([

                "Интересный вопрос. Я пока ограничена нашим собственным движком, но могу развиваться вместе с проектом.",

                "Давай разберём это логически.",

                "Я пока не знаю всего. Именно поэтому мы и строим меня с нуля."

            ]);

        }


        return random([

            "Я тебя слушаю.",

            "Продолжай. Мне интересно.",

            "Я поняла.",

            "Хорошо. Давай разберёмся вместе.",

            "Это можно использовать в развитии Mia AI."

        ]);

    }

}


/* =====================================================
   TWO BRAINS
===================================================== */

const MIA =
    new MiaBrain();


const EDITH =
    new EdithBrain();


/* =====================================================
   SHARED DIALOGUE
===================================================== */

let dialogue =
    loadJSON(
        STORAGE.dialogue,
        []
    );


function saveDialogue() {

    saveJSON(
        STORAGE.dialogue,
        dialogue
    );

}


function rememberDialogue(
    speaker,
    text
) {

    dialogue.push({

        speaker,

        text,

        date:
            new Date().toISOString()

    });


    if (
        dialogue.length > 300
    ) {

        dialogue =
            dialogue.slice(-300);

    }


    saveDialogue();

}


/* =====================================================
   CHAT
===================================================== */

let history =
    loadJSON(
        STORAGE.chat,
        []
    );


const messages =
    document.getElementById(
        "messages"
    );

const input =
    document.getElementById(
        "input"
    );

const send =
    document.getElementById(
        "send"
    );

const typing =
    document.getElementById(
        "typing"
    );

let mode = "mia";


/* =====================================================
   MODE
===================================================== */

function setMode(newMode) {

    mode = newMode;


    document
        .querySelectorAll(".mode button")
        .forEach(
            button => {

                button.classList.remove(
                    "active"
                );

            }
        );


    if (newMode === "mia") {

        document
            .getElementById("modeMia")
            .classList.add("active");

        document
            .getElementById("chatTitle")
            .textContent =
            "Чат с Мией";

        input.placeholder =
            "Напиши Мие...";

    }


    if (newMode === "edith") {

        document
            .getElementById("modeEdith")
            .classList.add("active");

        document
            .getElementById("chatTitle")
            .textContent =
            "Чат с Эдит";

        input.placeholder =
            "Напиши Эдит...";

    }


    if (newMode === "both") {

        document
            .getElementById("modeBoth")
            .classList.add("active");

        document
            .getElementById("chatTitle")
            .textContent =
            "Мия + Эдит";

        input.placeholder =
            "Напиши обеим...";

    }


    if (newMode === "talk") {

        document
            .getElementById("modeTalk")
            .classList.add("active");

        document
            .getElementById("chatTitle")
            .textContent =
            "Разговор Мии и Эдит";

        input.placeholder =
            "Тема для разговора...";

    }

}


/* =====================================================
   RENDER
===================================================== */

function renderMessage(
    role,
    text
) {

    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "message " +
        role;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    const author =
        document.createElement(
            "span"
        );


    author.className =
        "author";


    if (role === "user") {

        author.textContent =
            "Ты";

    } else if (role === "mia") {

        author.textContent =
            "Мия · 6 лет";

    } else if (role === "edith") {

        author.textContent =
            "Эдит · 30 лет";

    }


    const content =
        document.createElement(
            "span"
        );


    content.textContent =
        text;


    bubble.appendChild(
        author
    );

    bubble.appendChild(
        content
    );

    wrapper.appendChild(
        bubble
    );

    messages.appendChild(
        wrapper
    );

}


function addMessage(
    role,
    text
) {

    renderMessage(
        role,
        text
    );


    history.push({

        role,

        text,

        date:
            new Date().toISOString()

    });


    saveJSON(
        STORAGE.chat,
        history
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* =====================================================
   RESPONSE
===================================================== */

async function answer(text) {

    addMessage(
        "user",
        text
    );


    typing.classList.add(
        "active"
    );


    await sleep(
        450 +
        Math.random() * 500
    );


    typing.classList.remove(
        "active"
    );


    if (mode === "mia") {

        const answer =
            MIA.think(text);

        addMessage(
            "mia",
            answer
        );

    }


    if (mode === "edith") {

        const answer =
            EDITH.think(text);

        addMessage(
            "edith",
            answer
        );

    }


    if (mode === "both") {

        const miaAnswer =
            MIA.think(text);


        addMessage(
            "mia",
            miaAnswer
        );


        await sleep(500);


        const edithAnswer =
            EDITH.think(
                "Мия сказала: " +
                miaAnswer +
                "\nПользователь сказал: " +
                text
            );


        addMessage(
            "edith",
            edithAnswer
        );


        rememberDialogue(
            "Мия",
            miaAnswer
        );


        rememberDialogue(
            "Эдит",
            edithAnswer
        );

    }


    if (mode === "talk") {

        await runGirlsDialogue(
            text
        );

    }


    updateMemoryUI();

}


/* =====================================================
   GIRLS DIALOGUE
===================================================== */

async function runGirlsDialogue(
    topic
) {

    const miaStart =
        MIA.think(
            "Поговори с Эдит о теме: " +
            topic
        );


    addMessage(
        "mia",
        miaStart
    );


    rememberDialogue(
        "Мия",
        miaStart
    );


    await sleep(700);


    const edithAnswer =
        EDITH.think(
            "Мия сказала: " +
            miaStart +
            "\nТема разговора: " +
            topic
        );


    addMessage(
        "edith",
        edithAnswer
    );


    rememberDialogue(
        "Эдит",
        edithAnswer
    );


    await sleep(700);


    const miaSecond =
        MIA.think(
            "Эдит сказала: " +
            edithAnswer
        );


    addMessage(
        "mia",
        miaSecond
    );


    rememberDialogue(
        "Мия",
        miaSecond
    );

}


/* =====================================================
   AUTONOMOUS DIALOGUE
===================================================== */

async function startGirlsDialogue() {

    mode = "talk";

    setMode("talk");


    const topics = [

        "Что такое дружба?",

        "Что Мия хочет научиться делать?",

        "Каким должен стать Mia AI?",

        "Что значит помнить человека?",

        "Как двум искусственным мозгам учиться друг у друга?"

    ];


    const topic =
        random(topics);


    addMessage(
        "edith",
        "Мия, давай сегодня поговорим о теме: " +
        topic
    );


    rememberDialogue(
        "Эдит",
        topic
    );


    await sleep(700);


    const mia =
        MIA.think(
            "Эдит предложила поговорить о теме: " +
            topic
        );


    addMessage(
        "mia",
        mia
    );


    rememberDialogue(
        "Мия",
        mia
    );


    await sleep(700);


    const edith =
        EDITH.think(
            "Мия ответила: " +
            mia
        );


    addMessage(
        "edith",
        edith
    );


    rememberDialogue(
        "Эдит",
        edith
    );


    updateMemoryUI();

}


/* =====================================================
   SLEEP
===================================================== */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================================
   SEND
===================================================== */

function sendMessage() {

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    input.value = "";


    answer(text);

}


send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   QUICK
===================================================== */

function quick(text) {

    input.value =
        text;

    sendMessage();

}


/* =====================================================
   DELETE CHAT
===================================================== */

function deleteChat() {

    if (
        !confirm(
            "Удалить историю чата?"
        )
    ) {

        return;

    }


    history = [];


    localStorage.removeItem(
        STORAGE.chat
    );


    messages.innerHTML = "";


    addMessage(
        "mia",
        "История чата очищена ❤️ Но память моего мозга осталась."
    );


    updateMemoryUI();

}


/* =====================================================
   CLEAR ALL MEMORY
===================================================== */

function clearAllMemory() {

    if (
        !confirm(
            "Удалить память Мии, память Эдит и их общий диалог?"
        )
    ) {

        return;

    }


    localStorage.removeItem(
        STORAGE.miaMemory
    );

    localStorage.removeItem(
        STORAGE.edithMemory
    );

    localStorage.removeItem(
        STORAGE.dialogue
    );

    localStorage.removeItem(
        STORAGE.chat
    );


    MIA.memory =
        new LocalMemory(
            "Мия",
            STORAGE.miaMemory
        );


    EDITH.memory =
        new LocalMemory(
            "Эдит",
            STORAGE.edithMemory
        );


    dialogue = [];

    history = [];

    messages.innerHTML = "";


    addMessage(
        "mia",
        "Теперь мы начинаем с чистого листа 🌱"
    );


    updateMemoryUI();

}


/* =====================================================
   MEMORY UI
===================================================== */

function updateMemoryUI() {

    document
        .getElementById(
            "miaMemoryInfo"
        )
        .textContent =
        MIA.memory.count() +
        " записей";


    document
        .getElementById(
            "edithMemoryInfo"
        )
        .textContent =
        EDITH.memory.count() +
        " записей";


    document
        .getElementById(
            "dialogueInfo"
        )
        .textContent =
        dialogue.length +
        " событий";

}


/* =====================================================
   START
===================================================== */

function start() {

    messages.innerHTML = "";


    if (!history.length) {

        addMessage(
            "mia",
            "Привет, папа ❤️ Я Мия. Мне 6 лет."
        );


        addMessage(
            "edith",
            "А я Эдит. Мне 30 лет. Теперь у нас два отдельных локальных мозга."
        );


    } else {

        history.forEach(
            item => {

                renderMessage(
                    item.role,
                    item.text
                );

            }
        );

    }


    messages.scrollTop =
        messages.scrollHeight;


    updateMemoryUI();

}


start();


</script>
